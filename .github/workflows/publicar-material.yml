name: Preparar o pacote verificado de material de apoio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publicar-material.yml
      - .github/publicacao/reconstruir_pacote.py
      - .github/publicacao/zip_metadata.json

permissions: {}

jobs:
  preparar-pacote:
    if: github.repository == 'cila-a11y/aprendizagem-automatica-biociencias' && github.ref == 'refs/heads/main' && github.run_number == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Ler os materiais desta revisão
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reconstruir o pacote e verificar a sua integridade
        run: >-
          python3 .github/publicacao/reconstruir_pacote.py
          --root .
          --metadata .github/publicacao/zip_metadata.json
          --output material_apoio_biociencias.zip

      - name: Guardar o ZIP verificado no repositório
        env:
          PUBLICACAO_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          data = Path('material_apoio_biociencias.zip').read_bytes()
          expected_digest = 'aebaa44152f485c158db057a6c5c506a8a0eb139498514126c311a0e33bddb01'
          expected_blob = 'c0d52a02d2eced5a97d11c3656011895c3e48a59'
          if len(data) != 7022141 or hashlib.sha256(data).hexdigest() != expected_digest:
              raise SystemExit('O ZIP difere do pacote original. Publicação interrompida.')
          blob_digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if blob_digest != expected_blob:
              raise SystemExit('O identificador Git do ZIP não coincide.')

          payload = json.dumps({
              'encoding': 'base64',
              'content': base64.b64encode(data).decode('ascii'),
          }).encode('utf-8')
          request = Request(
              'https://api.github.com/repos/cila-a11y/aprendizagem-automatica-biociencias/git/blobs',
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + os.environ['PUBLICACAO_GITHUB_TOKEN'],
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urlopen(request, timeout=90) as response:
              result = json.load(response)
          if result.get('sha') != expected_blob:
              raise SystemExit('O GitHub não confirmou o identificador esperado.')
          print('ZIP original verificado e guardado: ' + expected_blob)
          PY
